  # ==========================================================================
  #  POST /classify — classify text against taxonomy
  # ==========================================================================

  ClassifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-api-classify'
      RetentionInDays: !If [IsProd, 90, 14]

  ClassifyFunction:
    Type: AWS::Lambda::Function
    DependsOn: ClassifyLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api-classify'
      Description: Classifies input text against the frozen taxonomy
      Runtime: python3.12
      Handler: index.handler
      MemorySize: !Ref LambdaMemory
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt ApiHandlerRole.Arn
      Environment:
        Variables:
          TAXONOMY_TABLE: !Ref TaxonomyTableName
      Code:
        ZipFile: |
          """
          Classification API
          Accepts text input and classifies it against the frozen taxonomy.
          Returns domain, intent, confidence, and matching taxonomy entry.
          """
          import json
          import os
          import boto3
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')
          taxonomy_table = dynamodb.Table(os.environ['TAXONOMY_TABLE'])

          CORS_HEADERS = {
              'Content-Type': 'application/json',
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
          }

          # Keyword-based classification mapping
          KEYWORD_MAP = {
              'commerce': {
                  'keywords': ['buy', 'purchase', 'order', 'cart', 'checkout', 'price', 'product', 'shipping'],
                  'intents': {
                      'purchase_inquiry': ['buy', 'purchase', 'order'],
                      'pricing': ['price', 'cost', 'discount', 'coupon'],
                      'shipping': ['shipping', 'delivery', 'track'],
                      'returns': ['return', 'refund', 'exchange']
                  }
              },
              'support': {
                  'keywords': ['help', 'issue', 'problem', 'broken', 'error', 'complaint', 'support', 'ticket'],
                  'intents': {
                      'technical_issue': ['error', 'broken', 'bug', 'crash'],
                      'complaint': ['complaint', 'unhappy', 'disappointed', 'terrible'],
                      'general_inquiry': ['help', 'question', 'how to']
                  }
              },
              'feedback': {
                  'keywords': ['feedback', 'review', 'rating', 'survey', 'nps', 'satisfaction'],
                  'intents': {
                      'positive_feedback': ['great', 'excellent', 'love', 'amazing'],
                      'negative_feedback': ['poor', 'bad', 'worst', 'hate'],
                      'survey_response': ['survey', 'nps', 'rating']
                  }
              },
              'engagement': {
                  'keywords': ['browse', 'view', 'click', 'visit', 'explore', 'search'],
                  'intents': {
                      'browsing': ['browse', 'view', 'visit'],
                      'search': ['search', 'find', 'looking for'],
                      'content_engagement': ['click', 'read', 'watch']
                  }
              }
          }

          class DecimalEncoder(json.JSONEncoder):
              def default(self, obj):
                  if isinstance(obj, Decimal):
                      return float(obj) if obj % 1 else int(obj)
                  return super().default(obj)

          def classify_text(text):
              """Classify text using keyword matching against taxonomy."""
              text_lower = text.lower()
              best_match = {'domain': 'unknown', 'intent': 'unclassified', 'confidence': 0.0}

              for domain, config in KEYWORD_MAP.items():
                  # Check domain-level keywords
                  domain_hits = sum(1 for kw in config['keywords'] if kw in text_lower)
                  if domain_hits == 0:
                      continue

                  domain_confidence = min(domain_hits / len(config['keywords']) * 2, 1.0)

                  # Check intent-level keywords
                  best_intent = None
                  best_intent_confidence = 0.0
                  for intent, keywords in config['intents'].items():
                      intent_hits = sum(1 for kw in keywords if kw in text_lower)
                      if intent_hits > 0:
                          intent_confidence = min(intent_hits / len(keywords), 1.0)
                          if intent_confidence > best_intent_confidence:
                              best_intent = intent
                              best_intent_confidence = intent_confidence

                  combined_confidence = (domain_confidence + best_intent_confidence) / 2
                  if combined_confidence > best_match['confidence']:
                      best_match = {
                          'domain': domain,
                          'intent': best_intent or 'general',
                          'confidence': round(combined_confidence, 3),
                          'domain_confidence': round(domain_confidence, 3),
                          'intent_confidence': round(best_intent_confidence, 3)
                      }

              return best_match

          def handler(event, context):
              try:
                  body = json.loads(event.get('body', '{}'))
                  text = body.get('text', '')

                  if not text:
                      return {
                          'statusCode': 400,
                          'headers': CORS_HEADERS,
                          'body': json.dumps({'error': 'text field is required'})
                      }

                  classification = classify_text(text)

                  # Look up taxonomy entry if we got a match
                  taxonomy_entry = None
                  if classification['domain'] != 'unknown':
                      try:
                          resp = taxonomy_table.get_item(Key={
                              'domain': classification['domain'],
                              'intent': classification['intent']
                          })
                          taxonomy_entry = resp.get('Item')
                      except Exception:
                          pass

                  result = {
                      'input_text': text,
                      'classification': classification,
                      'taxonomy_entry': taxonomy_entry,
                      'method': 'keyword_deterministic'
                  }

                  return {
                      'statusCode': 200,
                      'headers': CORS_HEADERS,
                      'body': json.dumps(result, cls=DecimalEncoder)
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': CORS_HEADERS,
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ClassifyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DashboardApi
      ParentId: !GetAtt DashboardApi.RootResourceId
      PathPart: classify

  ClassifyPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DashboardApi
      ResourceId: !Ref ClassifyResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClassifyFunction.Arn}/invocations'

  ClassifyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DashboardApi
      ResourceId: !Ref ClassifyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ClassifyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ClassifyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardApi}/*'

  # ==========================================================================
  #  API Deployment & Stage
  # ==========================================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - DashboardGetMethod
      - DashboardOptionsMethod
      - CustomerGetMethod
      - CustomerOptionsMethod
      - JourneysGetMethod
      - JourneysOptionsMethod
      - NBAActionsGetMethod
      - NBAActionsOptionsMethod
      - ClassifyPostMethod
      - ClassifyOptionsMethod
    Properties:
      RestApiId: !Ref DashboardApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref DashboardApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for dashboard API'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: !If [IsProd, 1000, 100]
          ThrottlingRateLimit: !If [IsProd, 2000, 200]
          MetricsEnabled: true
          DataTraceEnabled: !If [IsProd, false, true]
          LoggingLevel: !If [IsProd, ERROR, INFO]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  #  API Usage Plan & API Key
  # ==========================================================================

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${ProjectName}-${Environment}-usage-plan'
      Description: Usage plan for the CX Intelligence dashboard API
      ApiStages:
        - ApiId: !Ref DashboardApi
          Stage: !Ref Environment
      Throttle:
        BurstLimit: !If [IsProd, 1000, 100]
        RateLimit: !If [IsProd, 2000, 200]
      Quota:
        Limit: !If [IsProd, 1000000, 100000]
        Period: MONTH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api-key'
      Description: API key for programmatic access to the dashboard API
      Enabled: true
      StageKeys:
        - RestApiId: !Ref DashboardApi
          StageName: !Ref Environment
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ApiKeyUsagePlanAssociation:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  DashboardApiUrl:
    Description: Dashboard REST API URL
    Value: !Sub 'https://${DashboardApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  DashboardApiId:
    Description: Dashboard REST API ID
    Value: !Ref DashboardApi

  CognitoUserPoolId:
    Description: Cognito User Pool ID for API authentication
    Value: !Ref CognitoUserPool
  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

  ApiKeyId:
    Description: API Key ID for programmatic access
    Value: !Ref ApiKey
